name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - main

jobs:

  root-check:  # General checks for entire project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # using the same node.js version
          cache: 'npm'  # using caching for efficiency
          cache-dependency-path: package-lock.json
      - name: Installing dependencies
        run: npm install
      - name: Security audit  # runs security audit on root, backend, and frontend
        run: npm run audit
      - name: Running unit tests
        run: npm test

  backend-server-check:  # Checks for the server and backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Installing dependencies
        run: npm install
      - name: Running server unit tests
        run: npm run test:server

  frontend-check:  # Checks for the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Installing dependencies
        run: npm install
      - name: Running frontend unit tests
        run: npm run test:frontend